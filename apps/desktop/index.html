<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#141414" />
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background-color: var(--vscode-editor-background, var(--startup-background, #141414));
      }
    </style>
    <script>
      (() => {
        let saved = null;
        try {
          saved = localStorage.getItem("cursor-byok.theme");
        } catch {
          // Use the system preference when storage is unavailable.
        }
        const light = saved === "default-light"
          || (saved !== "default-dark" && !window.matchMedia("(prefers-color-scheme: dark)").matches);
        const background = light ? "#fcfcfc" : "#141414";
        document.documentElement.dataset.theme = light ? "default-light" : "default-dark";
        document.documentElement.style.setProperty("--startup-background", background);
        document.documentElement.style.colorScheme = light ? "light" : "dark";
        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", background);
      })();
    </script>
    <title>Cursor BYOK</title>
  </head>

  <body>
    <noscript>Cursor BYOK 需要 JavaScript 才能运行。</noscript>
    <div id="root"></div>

    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
